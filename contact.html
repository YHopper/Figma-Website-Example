<body class="contact_home">
   <div class="navbar">
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="recent-work.html">Recent Work</a></li>

            <a href="https://www.linkedin.com/in/yong-weng-563389366/"><img src="./images/LinkedIn.svg"/></a>

    <div class="contact">
        <h1 class="contact-title">Contact Me</h1>
        <p>If you want to get in touch with me, please use the following form:</p>
    </div>

    <form action="#" method="POST">
    <div class="contactform">
        
        <div class="inputbox">
            <h2>Name</h2>
            <input type="text" placeholder="  Please enter your name" required />
        </div>

        <div class="inputbox">
            <h2>Email</h2>
            <input type="email" placeholder="  Please enter your email" required />
        </div>

        <div class="inputbox">
            <h2>Message</h2>
            <textarea placeholder="  Enter your message" required></textarea>
        </div>

        <div class="inputbox_btn">
            <input type="submit" value="Submit >" />
        </div>
    </div>

    <div class="footer">
        <p>Coded by Jason Weng</p>
    </div>
    
</body>
